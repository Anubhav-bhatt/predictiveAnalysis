version: 1
revision: charger_status_v2.0.0
name: charger_status_v2
description: Authoritative field dictionary for commercial DC fast-charger status
  telemetry (456 production positions + legacy fixture support).
includes:
- alarm.yaml
- charger.yaml
- communication.yaml
- configuration.yaml
- connector.yaml
- contactor.yaml
- counters.yaml
- identity.yaml
- legacy_fixture.yaml
- rectifier.yaml
- session.yaml
- smr.yaml
patterns:
- id: alarm_family
  match: ^Alarm\s+.+$
  entity: ALARM
  field_class: ALARM_FLAG
  category: ALARM
  data_type: ENUM
  unit: null
  nullable: true
  required: false
  review_status: AUTO_CLASSIFIED
  range_status: NOT_APPLICABLE
  allowed_values:
  - value: Not alarm
    meaning: alarm_inactive
- id: config_parameter_block
  match: ^Config Parameter\s+\d+$
  entity: CONFIGURATION
  field_class: CONFIGURATION
  category: SYSTEM
  data_type: UNKNOWN
  unit: null
  nullable: true
  required: false
  review_status: DOMAIN_REVIEW_REQUIRED
  range_status: UNVERIFIED
- id: reserved_spare_block
  match: ^Reserved Spare\s+\d+$
  entity: UNKNOWN
  field_class: UNKNOWN
  category: UNKNOWN
  data_type: UNKNOWN
  unit: null
  nullable: true
  required: false
  review_status: DOMAIN_REVIEW_REQUIRED
  range_status: UNVERIFIED

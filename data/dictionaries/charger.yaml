# Charger-level telemetry and configuration.

version: 1

fields:
  - source_name: Charger Status
    canonical_name: charger_status
    display_name: Charger Status
    description: Operating state of the charger as reported by its state machine.
    entity: CHARGER
    field_class: STATE
    category: STATE_MACHINE
    data_type: ENUM
    unit: null
    nullable: true
    required: false
    range_status: NOT_APPLICABLE
    normalization_strategy: CHARGER_SCALAR
    storage_strategy: CHARGER_TELEMETRY
    aggregation_strategy: LAST
    ml_candidate: "YES"
    prediction_domains:
      - charger_health
    leakage_risk: MEDIUM
    availability_semantics: REAL_TIME
    review_status: ENGINEER_REVIEWED
    notes: >-
      Observed values in the analysed sample are recorded as observed_values on
      the field profile. No authoritative allowed-value set is declared, so
      UNKNOWN_ENUM_VALUE does not fire for this field yet - the OCPP state set is
      vendor-extended in practice.

  - source_name: Cabinet Temperature
    canonical_name: cabinet_temperature
    display_name: Cabinet Temperature
    description: Internal cabinet air temperature.
    entity: CHARGER
    field_class: CONTINUOUS_TELEMETRY
    category: THERMAL
    data_type: FLOAT
    unit: "°C"
    nullable: true
    required: false
    range_status: UNVERIFIED
    normalization_strategy: CHARGER_SCALAR
    storage_strategy: CHARGER_TELEMETRY
    aggregation_strategy: MEAN
    ml_candidate: "YES"
    prediction_domains:
      - thermal_failure
      - charger_health
    leakage_risk: LOW
    availability_semantics: REAL_TIME
    review_status: ENGINEER_REVIEWED
    notes: >-
      No valid range asserted. The device operating envelope has not been
      supplied, and inventing -40..100 would create false OUT_OF_RANGE findings.


    entity: CHARGER
    field_class: COUNTER
    category: METER
    data_type: INTEGER
    unit: Wh
    nullable: true
    required: false
    valid_min: 0
    range_status: UNVERIFIED
    normalization_strategy: COUNTER_SNAPSHOT
    storage_strategy: COUNTER_TELEMETRY
    aggregation_strategy: MAX
    ml_candidate: "YES"
    leakage_risk: LOW
    availability_semantics: REAL_TIME
    review_status: ENGINEER_REVIEWED
    notes: >-
      Semantic type is INTEGER even though nulls can make a DataFrame infer
      float. Monotonic register; a decrease indicates a meter reset or rollover.

